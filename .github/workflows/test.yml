name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.1", "30.1", "snapshot"]
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Byte-compile (warnings are errors)
        run: emacs --batch -L . --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile write-on.el
      - name: Test
        run: emacs --batch -L . -l write-on-test.el -f ert-run-tests-batch-and-exit
