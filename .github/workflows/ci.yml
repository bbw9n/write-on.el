name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.1", "30.1", "snapshot"]
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Byte-compile (warnings are errors)
        run: emacs --batch -L . --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile write-on.el
      - name: Test
        run: emacs --batch -L . -l write-on-test.el -f ert-run-tests-batch-and-exit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: "30.1"
      - name: package-lint (MELPA's checks)
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(package-install 'package-lint)" \
            -f package-lint-batch-and-exit write-on.el
      - name: checkdoc (fail on any warning)
        shell: bash
        run: |
          out=$(emacs --batch --eval '(checkdoc-file "write-on.el")' 2>&1)
          echo "$out"
          ! grep -q "write-on.el:[0-9]" <<< "$out"

  melpazoid:
    # MELPA's review checks (https://github.com/riscy/melpazoid), per its
    # recommended workflow: builds the package from RECIPE in Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get install emacs && emacs --version
          git clone https://github.com/riscy/melpazoid.git ~/melpazoid
      - name: Run
        env:
          LOCAL_REPO: ${{ github.workspace }}
          RECIPE: (write-on :fetcher github :repo "bbw9n/write-on.el")
          # Fail on warnings too: write-on passes cleanly, keep it that way.
          WARN_IS_ERROR: true
          # Not on MELPA yet; set to true once it is.
          EXIST_OK: false
        run: echo $GITHUB_REF && make -C ~/melpazoid
